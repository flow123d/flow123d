# Test goal: 2D linear elastic simple loading problem.
# Author: Pavel Exner
# Source for reference:
# - same as 20_2d_block_load.yaml
# - the traction at the top is prescribed by bc_stress
# - the solutions are the same, checked in Paraview and kdiff

flow123d_version: 4.0.0a01
problem: !Coupling_Sequential
  description: 2D linear elastic simple loading problem.
  mesh:
    mesh_file: ../00_mesh/square_1x1_xy_28el.msh
  flow_equation: !Coupling_Iterative
    input_fields:
      - region: BULK
        biot_alpha: 0
        fluid_density: 1
        gravity: 0
    time:
      end_time: 1
    a_tol: 1e-15
    r_tol: 1e-12

    flow_equation: !Flow_Darcy_LMH
        input_fields:
          - region: BULK
            conductivity: 1
            init_pressure: 0
          - region: [.BOUNDARY]
            bc_type: dirichlet
            bc_pressure: 0
        output:
          fields: []

    mechanics_equation:
        output_stream:
          file: mechanics.pvd
          format: !vtk
        output:
          fields:
            - displacement
            - stress
            - displacement_divergence
        solver: !Petsc
          a_tol: 0
          r_tol: 1e-15
        user_fields:
          - name: mu
            field: !FieldFormula
              value: 80/(2*(1+0.2))
          - name: lambda
            field: !FieldFormula
              value: 80*0.2/((1+0.2)*(1-2*0.2))
        input_fields:
          - region: BULK
            #young_modulus: 80
            #poisson_ratio: 0.2
            elasticity_type: general
            stiffness_tensor_0: !FieldFormula
              value: "[[lambda+2*mu,          0,          0], [         0,      lambda,          0], [         0,          0,      lambda]]"
            stiffness_tensor_1: !FieldFormula
              value: "[[     lambda,          0,          0], [         0, lambda+2*mu,          0], [         0,          0,      lambda]]"
            stiffness_tensor_2: !FieldFormula
              value: "[[     lambda,          0,          0], [         0,      lambda,          0], [         0,          0, lambda+2*mu]]"
            stiffness_tensor_3: !FieldFormula
              value: "[[          0,          0,          0], [         0,           0, sqrt(2)*mu], [         0, sqrt(2)*mu,           0]]"
            stiffness_tensor_4: !FieldFormula
              value: "[[          0,          0, sqrt(2)*mu], [         0,           0,          0], [sqrt(2)*mu,          0,           0]]"
            stiffness_tensor_5: !FieldFormula
              value: "[[          0, sqrt(2)*mu,          0], [sqrt(2)*mu,           0,          0], [         0,          0,           0]]"

          - region: [.left_x, .right_x]
            bc_type: displacement_n
            bc_displacement: 0

          - region: [.bottom_y]
            bc_type: displacement
            bc_displacement: 0

          # the same effect by traction BC
          #- region: .top_y
            #bc_type: traction
            #bc_traction: [0,-20,0]
          - region: .top_y
            bc_type: stress
            bc_stress: [100,20,300]
